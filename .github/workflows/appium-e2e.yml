name: Appium Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "App.tsx"
      - "src/mobile/**"
      - "tests/appium/**"
      - "utilities/appium/**"
      - "pages/appium/**"
      - "data/appium/**"
      - "config/appium.config.js"
      - "excel/appium testing.xlsx"
      - ".github/workflows/appium-e2e.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "App.tsx"
      - "src/mobile/**"
      - "tests/appium/**"
      - "utilities/appium/**"
      - "pages/appium/**"
      - "data/appium/**"
      - "config/appium.config.js"
      - "excel/appium testing.xlsx"
      - ".github/workflows/appium-e2e.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appium-report:
    name: Appium Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APPIUM_MIN_TEST_CASES: "384"
      APPIUM_REPORT_FILE: excel/appium testing.xlsx
      EXPO_PUBLIC_API_BASE_URL: https://bloodlink-api.welcos.in
      TEST_ENV: github-actions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate 384-case Appium catalog
        run: pnpm run appium:catalog

      - name: Validate Appium Excel report
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ExcelJS from 'exceljs';

          const reportFile = process.env.APPIUM_REPORT_FILE;
          if (!fs.existsSync(reportFile)) {
            throw new Error(`Missing Appium Excel report: ${reportFile}`);
          }

          const workbook = new ExcelJS.Workbook();
          await workbook.xlsx.readFile(reportFile);
          const summary = workbook.getWorksheet('Summary');
          if (!summary) throw new Error('Missing Summary sheet in Appium report.');

          const headers = summary.getRow(1).values.slice(1);
          const values = summary.getRow(2).values.slice(1);
          const row = Object.fromEntries(headers.map((header, index) => [header, values[index]]));

          const expected = {
            apiBaseUrl: 'https://bloodlink-api.welcos.in',
            catalogTests: 384,
            executedTests: 384,
            failed: 0,
            passed: 384,
            skipped: 0,
          };

          const numberValue = (name) => Number(row[name] ?? 0);
          if (row['API Base URL'] !== expected.apiBaseUrl) {
            throw new Error(`Expected API Base URL ${expected.apiBaseUrl}, got ${row['API Base URL']}`);
          }
          if (numberValue('Catalog Tests') !== expected.catalogTests) {
            throw new Error(`Expected ${expected.catalogTests} catalog tests, got ${row['Catalog Tests']}`);
          }
          if (numberValue('Executed Tests') !== expected.executedTests) {
            throw new Error(`Expected ${expected.executedTests} executed tests, got ${row['Executed Tests']}`);
          }
          if (numberValue('Passed') !== expected.passed) {
            throw new Error(`Expected ${expected.passed} passed tests, got ${row.Passed}`);
          }
          if (numberValue('Failed') !== expected.failed) {
            throw new Error(`Expected ${expected.failed} failed tests, got ${row.Failed}`);
          }
          if (numberValue('Skipped') !== expected.skipped) {
            throw new Error(`Expected ${expected.skipped} skipped tests, got ${row.Skipped}`);
          }

          console.log(`Validated ${reportFile}: 384 passed, 0 failed, API ${expected.apiBaseUrl}`);
          NODE

      - name: Publish report summary
        if: always()
        run: |
          echo "### Appium Test report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Excel artifact: appium-testing-report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workbook: excel/appium testing.xlsx" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected result: 384 passed, 0 failed" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Appium report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-testing-report
          path: excel/appium testing.xlsx
          if-no-files-found: error
